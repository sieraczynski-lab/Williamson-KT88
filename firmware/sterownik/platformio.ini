; Williamson KT88 - sterownik (plytka "sterowanie", ESP32-S3-DevKitC-1 N16R8)
; Zalozenia: docs/10-oprogramowanie-esp32.md
;
; Srodowiska:
;   bench - etap 1: przekazniki na stole (diody zamiast cewek), pomiary symulowane z konsoli ("sim")
;   amp   - wzmacniacz: tylko prawdziwe pomiary. Do czasu etapu 2 (ADS1115) brak pomiarow = FAULT przy wlaczaniu.

[platformio]
default_envs = bench
; Osobny katalog PlatformIO: pioarduino 55.x instaluje do swojego penv wlasny fork PlatformIO Core
; i pakiety Pythona. We wspolnym ~/.platformio zmienialoby to srodowisko innych projektow
; (a gole "platform = espressif32" w innych projektach wybraloby najwyzsza wersje, czyli te).
core_dir = ${sysenv.USERPROFILE}/.platformio-pioarduino

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi      ; N16R8: flash QIO + PSRAM Octal (GPIO35-37 zajete)
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_echo = no

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFW_VERSION=\"0.1-etap1\"
    ; K11 selektora (wyciszenie, selektor 7.5):
    ;   1 = wariant b: J6 pin 3 polaczony z COIL11, dzwiek wlacza GPIO14 (ULN), GPB2 MCP23017 = 0.
    ;       Zawieszony / resetowany ESP32 od razu wycisza wyjscie.
    ;   0 = wariant a: K11 tylko przez MCP23017 GPB2, J3 wolne.
    -DMUTE_VIA_GPIO14=1

[env:bench]
extends = common
build_flags = ${common.build_flags} -DBENCH_SIM=1

[env:amp]
extends = common
