<polyline class="w" points="220,270 200,270"/>
<text class="net" x="192" y="274" text-anchor="end">g2 V5</text>
<text class="net" x="192" y="246" text-anchor="end">(nóżka 4)</text>
<rect class="part" x="540" y="120" width="300" height="210"/>
<text class="ref" x="554" y="142" text-anchor="start">Płytka UL (jedna, 4 przekaźniki), K1 = V5</text>
<circle class="term" cx="840" cy="170" r="5"/>
