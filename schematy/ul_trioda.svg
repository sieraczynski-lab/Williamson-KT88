<text class="op" x="728" y="244" text-anchor="start">NC: UL</text>
<text class="val" x="640" y="290" text-anchor="middle">COM</text>
<rect class="part" x="560" y="296" width="56" height="22"/>
<text class="val" x="588" y="312" text-anchor="middle">cewka</text>
<circle class="term" cx="588" cy="330" r="5"/>
<polyline class="w" points="588,318 588,325"/>
<text class="net" x="588" y="356" text-anchor="middle">J5 ← sterowanie J11 piny 1–2 (12 V)</text>
<path class="coil chgc" d="M1150 150 A10 10 0 0 1 1150 170 A8.33333 8.33333 0 0 1 1150 186.667 A8.33333 8.33333 0 0 1 1150 203.333 A8.33333 8.33333 0 0 1 1150 220 A8 8 0 0 1 1150 236 A8 8 0 0 1 1150 252 A8 8 0 0 1 1150 268 A8 8 0 0 1 1150 284 A8 8 0 0 1 1150 300"/>
<text class="ref chg" x="1150" y="132" text-anchor="middle">TTG-KT88PP, uzwojenie pierwotne</text>
<text class="val" x="1180" y="174" text-anchor="start">anoda A (V5)</text>
<text class="val" x="1180" y="224" text-anchor="start">odczep UL A</text>
<text class="val" x="1180" y="304" text-anchor="start">CT → J101-3 bez zmian</text>
<polyline class="w" points="845,170 1150,170"/>
<polyline class="w" points="845,220 1150,220"/>
<circle class="dot" cx="920" cy="170" r="3.2"/>
<polyline class="w" points="920,170 920,80 430,80 430,170 335,170"/>
<circle class="dot" cx="430" cy="170" r="3.2"/>
<text class="net" x="675" y="72" text-anchor="middle">anoda: toroid → J101-1 Onyxa i J1-1 płytki UL</text>
<text class="net" x="1000" y="212" text-anchor="middle">odczep UL tylko na płytkę UL</text>
<polyline class="w" points="845,270 900,270 900,400 430,400 430,270 335,270"/>
<text class="net" x="665" y="420" text-anchor="middle">G2: J1-3 płytki UL → J101-2 Onyxa (dalej przez R125 do g2 V5)</text>
<text class="val" x="40" y="462" text-anchor="start">V6: J2 płytki UL (K2): anoda B toroidu L → J101-5 i J2-1, odczep UL B → J2-2, J2-3 → J101-4.</text>
<text class="val" x="40" y="482" text-anchor="start">V7, V8 (prawy kanał): J3 i J4 tej samej płytki UL, toroid P, złącze J201 Onyxa (J3-3 → J201-2, J4-3 → J201-4).</text>
<text class="val" x="40" y="502" text-anchor="start">Bez prądu w cewce G2 dostaje odczep UL (tryb UL). Cewka 12 V: G2 dostaje anodę (trioda, ok. 20–25 W).</text>
<text class="val" x="40" y="522" text-anchor="start">Przełączać tylko przy wyłączonych anodach (ESP32 robi to sam). Przewody anod i odczepów w izolacji min. 1 kV.</text>
<text class="val" x="40" y="542" text-anchor="start">Płytka UL nie ma masy: mocuj ją na tulejach izolacyjnych.</text>
</svg>
