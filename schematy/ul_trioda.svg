<circle class="term" cx="840" cy="220" r="5"/>
<text class="val" x="830" y="214" text-anchor="end">J1-2 UL</text>
<circle class="term" cx="840" cy="270" r="5"/>
<text class="val" x="830" y="264" text-anchor="end">J1-3 G2</text>
<polyline class="w" points="835,170 724,170"/>
